<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Ezana">
  <!--
    Ezana mark — rebuilt as vector from the logo-maker screenshot, on a
    transparent ground. Both parts use currentColor, so the mark takes the
    colour of whatever it sits in: set `color` on the parent and it follows.
    The swooshes sit at 62% so they read as the lighter grey of the original.
  -->
  <circle cx="401" cy="240" r="188" fill="none" stroke="currentColor" stroke-width="78"/>
  <g fill="currentColor" opacity="0.62">
    <path d="M5 250 C 190 345, 430 300, 790 110 C 470 235, 250 295, 5 250 Z"/>
    <path d="M88 338 C 240 405, 470 360, 700 250 C 470 320, 260 360, 88 338 Z"/>
  </g>
</svg>
