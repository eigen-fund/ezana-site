<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The Ezana mark, simplified for tab size. The full logo's two swooshes taper
    to points that disappear below about 40px, so this keeps one, thickened,
    and lets it run past the ring on both sides - that overhang is what stops
    the icon reading as a plain "O" at 16px.
    The cream ground is deliberate: a transparent icon with an ink mark would
    vanish against a dark browser theme.
  -->
  <rect width="32" height="32" fill="#FCFBF8"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#111418" stroke-width="5"/>
  <path fill="#5A5A5A" d="M0.5 19.5 C 8 27, 22 24, 31.5 8.5 C 22 18.5, 9 21, 0.5 19.5 Z"/>
</svg>
